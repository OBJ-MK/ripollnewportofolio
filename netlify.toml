# Fichier de configuration pour Netlify

[build]

  # Le dossier à publier une fois la commande terminée
  publish = "."

# Redirection du sous-domaine netlify.app vers le domaine primaire
[[redirects]]
  from = "https://ripolldarcia.netlify.app/*"
  to = "https://ripolldarcia.com/:splat"
  status = 301
  force = true

# Sitemap dynamique généré via Netlify Function (doit être AVANT le fallback SPA ci-dessous)
[[redirects]]
  from = "/sitemap.xml"
  to = "/.netlify/functions/sitemap"
  status = 200

# Fallback SPA : toute route inconnue renvoie index.html (nécessaire pour /blog/:slug, /mentions-legales, etc.)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200