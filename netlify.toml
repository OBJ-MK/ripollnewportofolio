# Fichier de configuration pour Netlify

[build]

  # Le dossier à publier une fois la commande terminée
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://www.clarity.ms; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://res.cloudinary.com https://ripolldarcia.com; font-src 'self'; connect-src 'self' https://api.ripolldarcia.com https://www.clarity.ms https://c.clarity.ms; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Permissions-Policy = "geolocation=(), camera=(), microphone=(), payment=()"

# Redirection du sous-domaine netlify.app vers le domaine primaire
[[redirects]]
  from = "https://ripolldarcia.netlify.app/*"
  to = "https://ripolldarcia.com/:splat"
  status = 301
  force = true

# Sitemap dynamique généré via Netlify Function (doit être AVANT le fallback SPA ci-dessous)
[[redirects]]
  from = "/sitemap.xml"
  to = "/.netlify/functions/sitemap"
  status = 200

# Fallback SPA : toute route inconnue renvoie index.html (nécessaire pour /blog/:slug, /mentions-legales, etc.)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

